name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write   # para publicar el APK en Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la web (www/)
        run: npm run www

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Iconos de la app
        continue-on-error: true      # si falla, se queda el icono por defecto
        run: |
          pip install pillow
          python3 tools/make-icons.py
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK (debug, instalable)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar
        run: cp android/app/build/outputs/apk/debug/app-debug.apk franja.apk

      - uses: actions/upload-artifact@v4
        with:
          name: franja-apk
          path: franja.apk

      - name: Publicar en Releases (enlace fijo de descarga)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Franja (APK más reciente)
          body: |
            APK de depuración firmado con la clave debug: se instala directamente en Android.
            Compilado automáticamente desde el último commit de `main`.
          files: franja.apk
          make_latest: true
